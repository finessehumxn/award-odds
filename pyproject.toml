[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "award-odds"
version = "0.1.0"
description = "Before you apply for a federal grant, see who actually won it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "L.Finesse Humxn" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
award-odds = "award_odds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/award_odds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real USASpending API (set AWARD_ODDS_LIVE=1)"]
